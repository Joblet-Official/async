<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Async Jobs</title>
  <style>
    :root {
      --async-blue: #2d55fb;
      --async-blue-dark: #1e3bb3;
      --async-accent-tint: #eef2ff;
      --async-border-tint: #c7d2fe;
      --text-main: #0f172a;
      --text-secondary: #475569;
      --card-bg: #ffffff;
      --border: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: transparent;
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 8px;
      -webkit-font-smoothing: antialiased;
    }

    .header {
      align-items: center;
      display: flex;
      justify-content: flex-end;
      margin-bottom: 16px;
    }

    .result-count {
      background: var(--async-accent-tint);
      border: 1px solid var(--async-border-tint);
      border-radius: 20px;
      color: var(--async-blue);
      flex-shrink: 0;
      font-size: 13px;
      font-weight: 700;
      padding: 4px 10px;
    }

    .carousel {
      display: flex;
      gap: 14px;
      overflow-x: auto;
      padding: 4px 0 16px;
      scroll-snap-type: x mandatory;
      scrollbar-color: var(--async-border-tint) transparent;
      scrollbar-width: thin;
    }

    .carousel::-webkit-scrollbar {
      height: 5px;
    }

    .carousel::-webkit-scrollbar-thumb {
      background: var(--async-border-tint);
      border-radius: 10px;
    }

    .job-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.06);
      display: flex;
      flex: 0 0 260px;
      flex-direction: column;
      gap: 12px;
      max-width: 260px;
      min-width: 260px;
      overflow: hidden;
      padding: 18px;
      position: relative;
      scroll-snap-align: start;
      transition: border-color 0.15s ease, box-shadow 0.15s ease, transform 0.15s ease;
    }

    .job-card::before {
      background: var(--async-blue);
      content: "";
      height: 3px;
      left: 0;
      position: absolute;
      top: 0;
      width: 100%;
    }

    .job-card:hover {
      border-color: var(--async-border-tint);
      box-shadow: 0 6px 20px rgba(45, 85, 251, 0.13);
      transform: translateY(-2px);
    }

    .job-tag {
      background: var(--async-accent-tint);
      border: 1px solid var(--async-border-tint);
      border-radius: 20px;
      color: var(--async-blue);
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      padding: 3px 8px;
      text-transform: uppercase;
      width: fit-content;
    }

    .job-title {
      color: var(--text-main);
      display: -webkit-box;
      font-size: 16px;
      font-weight: 700;
      line-height: 1.3;
      min-height: 42px;
      overflow: hidden;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }

    .job-meta {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .meta-row {
      align-items: center;
      color: var(--text-secondary);
      display: flex;
      font-size: 13px;
      gap: 6px;
      min-width: 0;
    }

    .meta-icon {
      flex-shrink: 0;
    }

    .meta-value {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .apply-btn {
      align-items: center;
      background: var(--async-blue);
      border-radius: 8px;
      color: #ffffff;
      display: flex;
      font-size: 14px;
      font-weight: 700;
      justify-content: center;
      margin-top: auto;
      padding: 10px 16px;
      text-align: center;
      text-decoration: none;
      transition: background 0.2s ease;
    }

    .apply-btn:hover,
    .apply-btn:focus-visible {
      background: var(--async-blue-dark);
    }

    .apply-btn:focus-visible {
      outline: 3px solid rgba(45, 85, 251, 0.35);
      outline-offset: 2px;
    }

    .loading-state,
    .empty-state {
      color: var(--text-secondary);
      font-size: 15px;
      padding: 40px 20px;
      text-align: center;
    }

    .spinner {
      animation: spin 0.7s linear infinite;
      border: 3px solid #e0e7ff;
      border-radius: 50%;
      border-top-color: var(--async-blue);
      height: 32px;
      margin: 0 auto 16px;
      width: 32px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      .job-card,
      .apply-btn,
      .spinner {
        animation: none;
        transition: none;
      }
    }
  </style>
</head>
<body>
  <main id="root" aria-live="polite">
    <div class="loading-state">
      <div class="spinner" aria-hidden="true"></div>
      Loading opportunities...
    </div>
  </main>

  <script type="module">
    const root = document.getElementById("root");
    const MAX_VISIBLE_CARDS = 8;
    let dataReceived = false;

    // Old conversations can retain an iframe after its tool payload is gone.
    // Clear the loading state instead of presenting that stale state as an error.
    setTimeout(() => {
      if (!dataReceived) root.innerHTML = "";
    }, 3000);

    function renderJobs(payload) {
      dataReceived = true;
      const data = payload && payload.type && payload.data ? payload.data : payload;

      if (!data || !Array.isArray(data.jobs)) {
        root.innerHTML = "";
        return;
      }

      if (data.jobs.length === 0) {
        root.innerHTML = '<div class="empty-state">No jobs found. Try a different search.</div>';
        return;
      }

      const visibleJobs = data.jobs.slice(0, MAX_VISIBLE_CARDS);
      const total = Number.isFinite(Number(data.totalResults))
        ? Math.max(visibleJobs.length, Number(data.totalResults))
        : data.jobs.length;

      const cards = visibleJobs.map((job) => {
        const safeUrl = toSafeHttpsUrl(job.applicationUrl);
        const employer = job.employer || "Employer not listed";
        const employmentType = job.schedule || job.contractType || "Type not listed";

        return `
          <article class="job-card">
            <div class="job-tag">Job match</div>
            <h3 class="job-title">${escapeHtml(job.title || "Open position")}</h3>
            <div class="job-meta">
              <div class="meta-row">
                <span class="meta-icon" aria-hidden="true">📍</span>
                <span class="meta-value">${escapeHtml(job.location || "Remote")}</span>
              </div>
              <div class="meta-row">
                <span class="meta-icon" aria-hidden="true">💼</span>
                <span class="meta-value">${escapeHtml(employmentType)}</span>
              </div>
              <div class="meta-row">
                <span class="meta-icon" aria-hidden="true">🏢</span>
                <span class="meta-value">${escapeHtml(employer)}</span>
              </div>
            </div>
            ${safeUrl
              ? `<a href="${escapeHtml(safeUrl)}" data-url="${escapeHtml(safeUrl)}" target="_blank" rel="noopener noreferrer" class="apply-btn">View &amp; Apply →</a>`
              : '<span class="apply-btn" aria-disabled="true">Application unavailable</span>'}
          </article>`;
      }).join("");

      const countLabel = `${total} ${total === 1 ? "result" : "results"}`;
      root.innerHTML = `
        <div class="header">
          <div class="result-count">${escapeHtml(countLabel)}</div>
        </div>
        <section class="carousel" aria-label="Showing ${visibleJobs.length} of ${total} matching jobs">
          ${cards}
        </section>`;
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function toSafeHttpsUrl(value) {
      try {
        const url = new URL(String(value || ""));
        return url.protocol === "https:" ? url.href : "";
      } catch {
        return "";
      }
    }

    function openExternalUrl(url) {
      if (!url) return;
      try {
        if (window.openai && typeof window.openai.openExternal === "function") {
          window.openai.openExternal({ href: url });
          return;
        }
      } catch {}
      window.open(url, "_blank", "noopener,noreferrer");
    }

    root.addEventListener("click", (event) => {
      const link = event.target.closest("[data-url]");
      if (!link) return;
      event.preventDefault();
      openExternalUrl(link.getAttribute("data-url"));
    });

    window.addEventListener("openai:set_globals", (event) => {
      const globals = event.detail?.globals;
      if (globals?.toolOutput) renderJobs(globals.toolOutput);
    });

    if (window.openai?.toolOutput) renderJobs(window.openai.toolOutput);
    if (window.openai?.onToolOutput) {
      window.openai.onToolOutput((data) => renderJobs(data));
    }
  </script>
</body>
</html>
